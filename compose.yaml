services:
  caddy:
    image: caddy:2-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
    depends_on:
      - client

  client:
    image: aarish96/houzez-client:latest
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - server

  server:
    image: aarish96/houzez-server:latest
    restart: always
    ports:
      - "5000:5000"
    env_file:
      - ./server/.env
    depends_on:
      - redis

  redis:
    image: redis:7
    restart: always
    ports:
      - "6379:6379"

volumes:
  caddy_data: